name: Veille RSS

# Récupère automatiquement les derniers articles (cybersécurité en F1/WEC)
# et met à jour veille-feed.json, lu par la page veille.html.
# Les workflows planifiés ne s'exécutent que depuis la branche par défaut (portfolio).

on:
  schedule:
    - cron: '0 6,18 * * *'   # tous les jours à 06:00 et 18:00 UTC
  workflow_dispatch:          # permet de lancer la mise à jour à la main

permissions:
  contents: write

concurrency:
  group: veille-rss
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: portfolio

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer le flux
        run: node scripts/build-veille-feed.mjs

      - name: Committer si le flux a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille-feed.json
          if git diff --staged --quiet; then
            echo "Aucun changement dans le flux."
          else
            git commit -m "Veille RSS : mise à jour automatique du flux [skip ci]"
            git push origin HEAD:portfolio
          fi
